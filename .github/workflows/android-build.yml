name: Build Android APK

on:
push:
branches: [ "main", "master" ]
pull_request:
branches: [ "main", "master" ]

Возможность запускать сборку вручную одной кнопкой из вкладки Actions

workflow_dispatch:

STREAMING_CHUNK:Configuring build job and environment...

jobs:
build:
name: Build Debug APK
runs-on: ubuntu-latest

steps:
  # STREAMING_CHUNK:Checking out repository source code...
  - name: Checkout repository
    uses: actions/checkout@v4

  # STREAMING_CHUNK:Setting up Java Development Kit (JDK 17)...
  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: 'zulu'
      java-version: '17'
      cache: 'gradle'

  # STREAMING_CHUNK:Granting execution permissions to Gradle wrapper...
  - name: Grant execute permission for gradlew
    run: chmod +x gradlew

  # STREAMING_CHUNK:Running Gradle assembleDebug build...
  - name: Build with Gradle
    run: ./gradlew assembleDebug --stacktrace

  # STREAMING_CHUNK:Uploading generated APK as downloadable artifact...
  - name: Upload APK Artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-debug
      path: app/build/outputs/apk/debug/app-debug.apk
      retention-days: 7
